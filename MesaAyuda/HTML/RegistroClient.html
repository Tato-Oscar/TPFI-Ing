<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Registro de nuevo usuario</title>

    <style type="text/css">
      label {
        font-size: 18px;
      }
      form {
        width: 500px;
        border: 1px solid black;
      }
      input {
        margin: 7px;
        padding: 2px;
      }
      .txt {
        display: inline-block;
        width: 80%;
        outline: none;
        margin: 0;
      }

      ul.breadcrumb {
        padding: 10px 16px;
        list-style: none;
        background-color: #eee;
      }
      ul.breadcrumb li {
        display: inline;
        font-size: 18px;
      }
      ul.breadcrumb li + li:before {
        padding: 8px;
        color: black;
        content: "/\00a0";
      }
      ul.breadcrumb li a {
        color: #0275d8;
        text-decoration: none;
      }
      ul.breadcrumb li a:hover {
        color: #01447e;
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <!-- Encabezado -->
    <center>
      <img
        src="HelpDeskGirl.png"
        alt="Nuestra imagen corporativa"
        style="width:200px;height:150px;"
      />
    </center>

    <!-- Breadcrumb -->
    <center>
      <ul class="breadcrumb">
        <li><a href="loginClient.html">Login</a></li>
        <li>Registrarme</li>
      </ul>
    </center>

    <center>
      <h1>Sistema de Mesa de Ayuda</h1>
      <h2>Registro de nuevo usuario</h2>
    </center>

    <!-- Formulario -->
    <center>
      <form id="registerForm" method="POST" style="background-color:#d8f7cf">
        <br />
        <table>
          <!-- Nombre -->
          <tr>
            <td><label for="nombre">Nombre completo</label></td>
          </tr>
          <tr>
            <td>
              <input
                class="txt"
                id="nombre"
                name="nombre"
                type="text"
                placeholder="Nombre completo"
                required
              />
            </td>
          </tr>

          <!-- Correo -->
          <tr>
            <td><label for="contacto">Correo electrónico</label></td>
          </tr>
          <tr>
            <td>
              <input
                class="txt"
                id="contacto"
                name="contacto"
                type="email"
                placeholder="Correo Electrónico"
                required
              />
            </td>
          </tr>

          <!-- Contraseña -->
          <tr>
            <td><label for="password">Contraseña</label></td>
          </tr>
          <tr>
            <td>
              <input
                class="txt"
                id="password"
                name="password"
                type="password"
                placeholder="Contraseña"
                required
              />
            </td>
          </tr>

          <!-- Confirmar contraseña -->
          <tr>
            <td><label for="confirmar">Confirmar contraseña</label></td>
          </tr>
          <tr>
            <td>
              <input
                class="txt"
                id="confirmar"
                name="confirmar"
                type="password"
                placeholder="Repite la contraseña"
                required
              />
            </td>
          </tr>

          <!-- Checkbox -->
          <tr>
            <td>
              <br />
              <input id="terms" name="termscondition" type="checkbox" />
              Acepto los términos y condiciones del ingreso al sistema (S.E.u.O)
              <br />
            </td>
          </tr>

          <!-- Mensaje -->
          <tr>
            <td><center><span id="msg"></span></center></td>
          </tr>
        </table>

        <button type="submit">&lt; Registrarme</button>
      </form>

      <p>
        ¡Todo lo que Ud. diga o haga en éste sistema podrá ser usado en su
        contra!
      </p>
    </center>

    <script src="RegistroClient.js" type="module"></script>
  </body>
</html>
