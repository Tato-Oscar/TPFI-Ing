<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 152px;
            padding: 0;
        }
        h1{
            text-align: center;
            color: #333;
            padding-bottom: 50px;
        }
        form {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1.2rem;
            display:block;

        }
    </style>
</head>

<body>
    <h1>Registrar Cliente</h1>

    <form action="/registrar" method="POST">
        <center>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Ingrese su email" required><br><br>

            <label for="Password">Password:</label>
            <input type="password" id="Password" name="password" placeholder="Ingrese su password" required><br><br>

            <input type="checkbox" id="resultado2" name="termscondition" required>
            <label for="resultado2">Acepto los términos y condiciones del ingreso al sistema (S.E.u.O)</label><br><br>

            <button type="submit">Registrar</button>
        </center>
    </form>
    <script src="RegistrarCliente.js"  type="module"></script>
</body>
</html>
