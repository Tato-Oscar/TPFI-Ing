<!DOCTYPE html>
<!-- Pantalla de restablecimiento de contraseña para Mesa de Ayuda -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restablecer contraseña - Mesa de Ayuda</title>
    <style>
      label {
        font-size: 18px;
      }
      form {
        width: min(600px, calc(100% - 24px));
        border: 1px solid black;
        box-sizing: border-box;
      }
      input {
        margin: 7px;
        padding: 2px;
      }
      .txt {
        display: inline-block;
        width: 70%;
        outline: none;
        margin: 0;
        box-sizing: border-box;
      }
      ul.breadcrumb {
        padding: 10px 16px;
        list-style: none;
        background-color: #eee;
      }
      ul.breadcrumb li {
        display: inline;
        font-size: 18px;
      }
      ul.breadcrumb li + li:before {
        padding: 8px;
        color: black;
        content: "/\00a0";
      }
      ul.breadcrumb li a {
        color: #0275d8;
        text-decoration: none;
      }
      ul.breadcrumb li a:hover {
        color: #01447e;
        text-decoration: underline;
      }
      #resultado {
        display: block;
        margin: 10px;
        min-height: 1.2em;
      }
      @media (max-width: 520px) {
        .txt {
          width: 95%;
          margin-top: 7px;
        }
      }
    </style>
  </head>
  <body>
    <center>
      <img src="HelpDeskGirl.png" alt="Nuestra imagen corporativa" style="width:200px;height:150px;" />
    </center>
    <center>
      <ul class="breadcrumb">
        <li><a href="loginClient.html">Login</a></li>
        <li>Restablecer contraseña</li>
      </ul>
    </center>
    <center>
      <h1>Sistema de Mesa de Ayuda</h1>
      <h2>Restablecer contraseña</h2>
    </center>
    <center>
      <form id="resetPasswordForm" method="POST" style="background-color:#d8f7cf">
        <br />
        <table>
          <tr>
            <td><label for="id">Correo electrónico</label></td>
          </tr>
          <tr>
            <td><input class="txt" id="id" name="id" type="email" placeholder="Correo electrónico del cliente" autocomplete="email" required /></td>
          </tr>
          <tr>
            <td><label for="password">Nueva contraseña</label></td>
          </tr>
          <tr>
            <td><input class="txt" id="password" name="password" type="password" placeholder="Nueva contraseña" autocomplete="new-password" required /></td>
          </tr>
          <tr>
            <td><label for="confirmarPassword">Repetir nueva contraseña</label></td>
          </tr>
          <tr>
            <td><input class="txt" id="confirmarPassword" name="confirmarPassword" type="password" placeholder="Repite la nueva contraseña" autocomplete="new-password" required /></td>
          </tr>
          <tr>
            <td><span id="resultado" role="status" aria-live="polite"></span></td>
          </tr>
        </table>
        <button type="submit">Actualizar contraseña</button>
        <br /><br />
      </form>
      <p>¡Todo lo que Ud. diga o haga en éste sistema podrá ser usado en su contra!</p>
    </center>
    <script src="ResetPassword.js" type="module"></script>
  </body>
</html>
